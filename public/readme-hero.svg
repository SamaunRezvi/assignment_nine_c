<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071019"/>
      <stop offset="55%" stop-color="#0b2a28"/>
      <stop offset="100%" stop-color="#0f3d38"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2dd4bf" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#2dd4bf" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="phone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0e2e2c"/>
      <stop offset="100%" stop-color="#071019"/>
    </linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="190" cy="100" r="200" fill="url(#glow1)"/>
  <circle cx="1030" cy="230" r="220" fill="url(#glow2)"/>

  <g opacity="0.08" stroke="#5eead4" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="230" x2="1200" y2="230"/>
  </g>

  <g transform="translate(220,160)">
    <circle r="90" fill="#020617" opacity="0.35" filter="url(#soft)"/>
    <rect x="-58" y="-100" width="116" height="200" rx="20" fill="url(#phone)" stroke="#14b8a6" stroke-width="2.5"
          style="filter:drop-shadow(0 14px 24px rgba(0,0,0,0.45))"/>
    <rect x="-42" y="-80" width="84" height="138" rx="6" fill="#031615"/>
    <circle cx="0" cy="72" r="8" fill="#14b8a6"/>

    <g>
      <animate attributeName="opacity" values="0;0;1;1;0;0" dur="5s" repeatCount="indefinite"/>
      <path d="M-16,-20 L16,-20 L16,12 L32,12 L0,48 L-32,12 L-16,12 Z" fill="#fbbf24"/>
    </g>
    <g>
      <animate attributeName="opacity" values="1;1;0;0;1" dur="5s" repeatCount="indefinite"/>
      <path transform="scale(0.6) translate(0,-50)"
            d="M0,-70 L11,-60 L11,-44 L27,-29 L44,-29 L50,-18 L44,-7 L27,-7 L11,8 L11,24 L0,35 L-11,24 L-11,8 L-27,-7 L-44,-7 L-50,-18 L-44,-29 L-27,-29 L-11,-44 L-11,-60 Z"
            fill="#f87171"/>
    </g>
  </g>

  <g font-family="Verdana, Arial, sans-serif">
    <text x="600" y="130" fill="#5eead4" font-size="13" letter-spacing="3" font-weight="bold" text-anchor="middle">
      DEVICE AND APPLIANCE REPAIR
    </text>
    <text x="600" y="172" fill="#f8fafc" font-size="40" font-weight="bold" text-anchor="middle">FixMate</text>
    <text x="600" y="202" fill="#99f6e4" font-size="16" text-anchor="middle">Book a technician. Pay after the job is done.</text>

    <circle cx="600" cy="236" r="58" fill="none" stroke="#2dd4bf" stroke-width="1.5" stroke-dasharray="4 10" opacity="0.6">
      <animateTransform attributeName="transform" type="rotate" from="0 600 236" to="360 600 236" dur="14s" repeatCount="indefinite"/>
    </circle>
  </g>

  <g transform="translate(980,160)">
    <rect x="-95" y="-98" width="190" height="196" rx="20" fill="#061b1a" stroke="#14b8a6" stroke-width="2"
          style="filter:drop-shadow(0 14px 26px rgba(0,0,0,0.45))"/>
    <circle cx="0" cy="-36" r="30" fill="#2dd4bf"/>
    <path d="M-40,66 C-40,12 40,12 40,66 Z" fill="#0d9488"/>

    <g>
      <animate attributeName="opacity" values="0;1;1;0" dur="5s" begin="1.3s" repeatCount="indefinite"/>
      <circle cx="46" cy="-66" r="22" fill="#fbbf24"/>
      <path d="M36,-66 l7,8 l16,-18" stroke="#071019" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="0" y="104" fill="#99f6e4" font-size="13" text-anchor="middle" font-family="Verdana, Arial, sans-serif">
      Verified Technician
    </text>
  </g>

  <g transform="translate(70,60)" opacity="0.5">
    <circle r="3" fill="#5eead4">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>
  <g transform="translate(1150,280)" opacity="0.5">
    <circle r="3" fill="#fbbf24">
      <animate attributeName="opacity" values="0.3;1;0.3" dur="3s" repeatCount="indefinite"/>
    </circle>
  </g>
</svg>
